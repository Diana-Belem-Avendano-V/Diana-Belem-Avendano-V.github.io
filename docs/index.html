<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta Capciosa</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <h1>¿Aceptas que tengo la razón en todo?</h1>

    <div class="container">
        <button id="btn-si" onclick="responderSi()">SÍ</button>
        <button id="btn-no" onmouseover="moverBoton()" onclick="moverBoton()">NO</button>
    </div>

    <script>
        function moverBoton() {
            const botonNo = document.getElementById('btn-no');
            
            // Calcula posiciones aleatorias dentro del área visible de la pantalla
            const x = Math.random() * (window.innerWidth - botonNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - botonNo.offsetHeight - 20);
            
            // Cambia la posición del botón de forma inmediata
            botonNo.style.left = x + 'px';
            botonNo.style.top = y + 'px';
        }

        function responderSi() {
            alert('¡Sabía que ibas a estar de acuerdo! 😉');
        }
    </script>

</body>
</html>
